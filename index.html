<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaDownloader - Premium Glassmorphism</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-download-alt"></i> Media<span>Downloader</span></h1>
            <p>Sosial şəbəkələrdən media yükləməyin ən asan yolu</p>
        </header>

        <main>
            <div class="glass-card input-section">
                <div class="input-wrapper">
                    <div id="platform-icon" class="platform-icon">
                        <i class="fas fa-link"></i>
                    </div>
                    <input type="text" id="url-input" placeholder="Media linkini bura yapışdırın..." autocomplete="off">
                    <button id="download-btn">
                        <span class="btn-text">Yüklə</span>
                        <div class="loader" id="btn-loader"></div>
                    </button>
                </div>
            </div>

            <div id="result-section" class="glass-card result-section hidden">
                <div class="media-info">
                    <div class="thumbnail-wrapper">
                        <img id="media-thumbnail" src="" alt="Thumbnail">
                    </div>
                    <div class="details">
                        <h3 id="media-title">Video Başlığı</h3>
                        <p id="media-platform"><i class="fab fa-tiktok"></i> TikTok</p>
                        
                        <div class="download-options">
                            <select id="quality-select">
                                <!-- Seçimlər dinamik əlavə olunacaq -->
                            </select>
                            <button id="final-download-btn" class="primary-btn">
                                <i class="fas fa-download"></i> İndi Yüklə
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="history-section">
                <h2><i class="fas fa-history"></i> Son Yükləmələr</h2>
                <div id="history-list" class="history-grid">
                    <!-- Tarixçə bura əlavə olunacaq -->
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 MediaDownloader. Bütün hüquqlar qorunur.</p>
        </footer>
    </div>

    <script src="/script.js"></script>
</body>
</html>
